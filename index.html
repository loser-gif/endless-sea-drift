<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#061e2c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="无尽海漂流"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png"><link rel="icon" href="./icons/icon-192.png"><link rel="stylesheet" href="./styles.css"><title>无尽海漂流 / Endless Sea Drift</title></head>
<body><main id="game"><canvas id="ocean" aria-label="木筏生存游戏，摇杆或 WASD 移动"></canvas>
<header id="hud"><div class="heading"><div><span class="eyebrow">ENDLESS SEA / DRIFT <span class="edition">VI</span></span><h1>无尽海漂流</h1></div><button id="pause">Ⅱ 暂停</button></div><div id="voyage"></div><div class="vitals"><label>饱腹 <span id="hungerText">100</span><progress id="hunger" max="100" value="100"></progress></label><label>淡水 <span id="thirstText">100</span><progress id="thirst" max="100" value="100"></progress></label></div><div id="inventory"><span>木材 <b id="wood">8</b></span><span>布料 <b id="cloth">2</b></span><span>食物 <b id="food">3</b></span><span>淡水 <b id="water">3</b></span></div></header>
<div id="notice" role="status">摇杆移动 · 靠近漂浮物后打捞</div>
<footer id="controls"><div id="stick" role="group" aria-label="移动摇杆"><span class="cross">＋</span><div id="thumb"></div><small>移动 / WASD</small></div><div class="actions"><button data-action="collect" class="primary">打捞 <kbd>E</kbd></button><button data-action="build" id="build" aria-pressed="false">扩建 <kbd>B</kbd></button><button data-action="eat">吃食物 <kbd>1</kbd></button><button data-action="drink">喝淡水 <kbd>2</kbd></button><button data-action="repair">修补 <kbd>R</kbd></button><button data-action="place" id="place" disabled>放置 <kbd>↵</kbd></button></div></footer>
<section id="overlay" class="overlay"><div class="card"><span class="eyebrow">A SMALL RAFT. AN ENDLESS SEA.</span><h2 id="dialogTitle">向海而生</h2><div id="dialogText"><p>打捞物资，拼起你的海上栖身之所。<br>中央鱼叉炮会自动抵御海怪。</p><p>摇杆 / WASD 移动，打捞圈内收集物资。<br>扩建后点绿色边格，或移动光标并放置。<br>及时吃喝；修补消耗 1 木材 + 1 布料。</p><p class="muted">横屏视野更开阔 · 竖屏同样可玩<br>Safari 分享 → 添加到主屏幕</p></div><button id="resume" class="primary">启航</button><p id="offline" class="muted">首次联网载入后可离线游玩</p></div></section></main><script src="./art.js" defer></script><script src="./game.js" defer></script></body></html>
